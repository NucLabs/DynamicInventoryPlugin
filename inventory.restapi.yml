---
plugin: nuclabs.dyninv.restapi
url: http://192.168.178.237:5000/server
auth_method: bearer
# bearer_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..BbMxcsuoIEyfMKQO7XBC_yUl4b_bkYxgTXrDKD5Coco

var_prefix: "mcmt_"

keyed_groups:
  - key: mcmt_domainname
    prefix: domain
  - key: mcmt_os
    prefix: os
  - key: mcmt_productlijn
    prefix: pl

compose:
  NexusUri: >-
    'https://nexus1' if productlijn == 'Productlijn C' else 'https://nexus2'

  NecusUri2: >-
    'https://nexus1' if productlijn == 'Productlijn A' else
    'https://nexus2' if productlijn == 'Productlijn B' else
    'https://nexus3' if productlijn == 'Productlijn C' else
    'https://nexus4' if productlijn == 'Productlijn D' else
    'https://nexus-default'

groups:
  dom1plb: mcmt_domainname == 'domain1' and mcmt_productlijn == 'Productlijn B